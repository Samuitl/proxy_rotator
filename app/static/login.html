<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxy-Rotator · Login</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#262d37; --text:#e6edf3; --muted:#8b949e; --accent:#3fb68b; --bad:#e5534b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width:min(360px, 92vw); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px; }
  h1 { margin:0 0 4px; font-size:20px; } p { margin:0 0 20px; color:var(--muted); font-size:13px; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg);
          color:var(--text); font-size:15px; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { margin-top:14px; width:100%; padding:10px; border:0; border-radius:8px; background:var(--accent);
           color:#06130d; font-weight:600; font-size:15px; cursor:pointer; }
  .err { color:var(--bad); font-size:13px; min-height:20px; margin-top:10px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--accent); margin-right:8px; }
</style>
</head>
<body>
<form id="f">
  <h1><span class="dot"></span>Proxy-Rotator</h1>
  <p>Internes Dashboard</p>
  <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" autofocus>
  <button type="submit">Anmelden</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  const r = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'},
                                    body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (r.ok) { location.href = '/'; return; }
  const d = await r.json().catch(() => ({}));
  err.textContent = d.error || 'Anmeldung fehlgeschlagen';
});
</script>
</body>
</html>
